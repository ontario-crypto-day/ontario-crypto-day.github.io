title: Ontario Cryptography Day
# Previously supplied implicitly by the github-pages bundle's jekyll-github-metadata
# plugin, which copied the GitHub repository description into site.description. That
# plugin is gone, so the value is set here to keep <meta name="description">,
# og:description, and the feed subtitle populated.
description: Source code for website of Ontario Cryptography Day
og_image: /images/socialmedia-20261209.png

url: https://ontario-crypto-day.github.io/
repository: ontario-crypto-day/ontario-crypto-day.github.io

theme: minimal-mistakes-jekyll
# documentation: https://mmistakes.github.io/minimal-mistakes/docs/quick-start-guide/

atom_feed:
  hide: true

# Jekyll 4 compiles Sass with Dart Sass, which defaults to expanded output plus
# .css.map files. Compress instead, matching the theme's recommended setting.
sass:
  style: compressed
  sourcemap: never

# Jekyll's default excludes, plus tools/ so its README is not copied into the site.
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby
  - tools

google_site_verification: "XLH71DSxCa-oc7wItgMB-gzxL2s2UvNjsdbdGgNuvXA"
