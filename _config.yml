title: Ontario Cryptography Day
og_image: /images/socialmedia-20261209.png

url: https://ontario-crypto-day.github.io/
repository: ontario-crypto-day/ontario-crypto-day.github.io

theme: minimal-mistakes-jekyll
# documentation: https://mmistakes.github.io/minimal-mistakes/docs/quick-start-guide/

atom_feed:
  hide: true

# Jekyll's default excludes, plus tools/ — without it the github-pages bundle's
# readme-index plugin publishes tools/README.md as a page at /tools/.
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby
  - tools

